name: Release

# Builds AnyFile with the giode CLI for Windows (x86-64 and ARM64, zip
# and installer), macOS (one universal app, zipped and as a disk image)
# and Linux (x86-64 and ARM64: tar.gz, .deb and .rpm) when a GitHub
# release is published, and attaches the packages to it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (and attach to, when publishing)
        required: true
      publish:
        description: Attach the packages to the release
        type: boolean
        default: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # The giode CLI, pinned so releases build reproducibly.
  GIODE_CLI: github.com/mehran9675/giode-cli/cmd/giode@f5c39c7

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The engines and the session have no GUI dependencies.
      - run: go vet ./internal/carve ./internal/cfb ./internal/detect ./internal/explore/... ./internal/install ./internal/oggopus ./internal/oodle ./internal/session ./internal/tools ./cmd/anyprobe
      - run: go test ./internal/carve ./internal/detect ./internal/install ./internal/oggopus ./internal/session ./internal/settings

  windows:
    name: Windows ${{ matrix.arch }}
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the giode CLI
        run: go install "$GIODE_CLI" && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Stamp the version
        run: .github/scripts/stamp-version.sh
      - name: Build app and installer
        run: |
          giode doctor || true
          giode build -arch ${{ matrix.arch }} windows windows-installer
          CGO_ENABLED=0 GOARCH=${{ matrix.arch }} go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o dist/windows/anyprobe.exe ./cmd/anyprobe
      - name: Package
        run: |
          mkdir -p out pkg
          cp dist/windows/AnyFile.exe dist/windows/anyprobe.exe README.md pkg/
          (cd pkg && 7z a -tzip "../out/AnyFile-$TAG-windows-${{ matrix.arch }}.zip" . > /dev/null)
          cp dist/windows/*-setup.exe "out/AnyFile-$TAG-windows-${{ matrix.arch }}-setup.exe"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: out/*

  linux:
    name: Linux ${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Gio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev \
            libxcursor-dev libvulkan-dev
      - name: Install the giode CLI
        run: go install "$GIODE_CLI" && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Stamp the version
        run: .github/scripts/stamp-version.sh
      - name: Build
        run: |
          giode build linux deb rpm
          go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o dist/linux/anyprobe ./cmd/anyprobe
      - name: Package
        run: |
          mkdir -p out
          mv dist/linux/*.deb "out/AnyFile-$TAG-linux-${{ matrix.arch }}.deb"
          mv dist/linux/*.rpm "out/AnyFile-$TAG-linux-${{ matrix.arch }}.rpm"
          cp README.md dist/linux/
          mv dist/linux dist/AnyFile
          tar -C dist -czf "out/AnyFile-$TAG-linux-${{ matrix.arch }}.tar.gz" AnyFile
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/*

  macos:
    name: macOS universal
    needs: test
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the giode CLI
        run: go install "$GIODE_CLI" && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Stamp the version
        run: .github/scripts/stamp-version.sh
      - name: Build
        run: |
          giode build macos
          # anyprobe as one universal binary next to the app's executable.
          for a in arm64 amd64; do
            CGO_ENABLED=0 GOARCH=$a go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "dist/anyprobe-$a" ./cmd/anyprobe
          done
          lipo -create -output dist/macos/AnyFile.app/Contents/MacOS/anyprobe dist/anyprobe-arm64 dist/anyprobe-amd64
          lipo -info dist/macos/AnyFile.app/Contents/MacOS/*
          # Ad-hoc signature: arm64 binaries must be signed to launch at all.
          codesign --force --deep --sign - dist/macos/AnyFile.app
      - name: Package
        run: |
          mkdir -p out
          ditto -c -k --keepParent dist/macos/AnyFile.app "out/AnyFile-$TAG-macos-universal.zip"
          # The disk image is made here rather than by giode build dmg,
          # which builds the app again without anyprobe and the signature.
          mkdir dmg && ditto dist/macos/AnyFile.app dmg/AnyFile.app && ln -s /Applications dmg/Applications
          hdiutil create -volname AnyFile -srcfolder dmg -ov -format UDZO "out/AnyFile-$TAG-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: out/*

  publish:
    name: Attach to release
    needs: [windows, linux, macos]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
