# giode.toml configures how the giode CLI builds this app.
# Reference: https://github.com/xmhrnx/giode-cli#giodetoml
#
# The release workflow sets version and the version in ldflags from the
# release tag; the values here are for local builds.

[app]
name = "AnyFile"
id = "com.mehran9675.anyfile"
version = "0.0.0"
build = 1
icon = "assets/icon.png"
package = "./cmd/anyfile"
publisher = "xmhrnx"
description = "Find out what any file really is, explore what's inside, and open each part in your own apps."
website = "https://github.com/xmhrnx/anyfile"
ldflags = "-s -w -X main.version=dev"

[macos]
min_os = 11

[windows]
arch = "amd64"

[windows.installer]
per_machine = false
desktop_shortcut = true

[linux]
categories = ["Utility", "System"]
maintainer = "xmhrnx <61628815+xmhrnx@users.noreply.github.com>"

# "Inspect with AnyFile" in the file manager's right-click menu, on every file.
# The Windows installer and the macOS app register it; Settings can add it
# for the current user otherwise.
[[context_actions]]
id = "inspect"
label = "Inspect with AnyFile"
files = true
